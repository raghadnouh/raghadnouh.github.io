name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir _site && cat site.tar.part* | tar -xf - -C _site && touch _site/.nojekyll
          if [ -f update.tar ]; then tar -xf update.tar -C _site; fi
          # V6 overlay: new page, cleaned paintings, teasers, CV, logos, protection tools
          if ls v6.tar.part* >/dev/null 2>&1; then cat v6.tar.part* | tar -xf - -C _site; fi
          if [ -f index.html ]; then cp index.html _site/index.html; fi
          # V6 rights protection: bake the RN watermark into every work image/page and rebuild PDFs (CV excluded)
          pip install -q --break-system-packages pillow
          if [ -f _site/tools/protect.py ]; then python3 _site/tools/protect.py _site && rm -rf _site/tools; fi
          mkdir -p _site/assets/lib
          curl -fsSL -o _site/assets/lib/pdf.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js || true
          curl -fsSL -o _site/assets/lib/pdf.worker.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js || true
          curl -fsSL -o _site/assets/lib/hls.min.js https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js || true
          ls -la _site/assets/lib
          sed -i 's#content="og.png"#content="https://raghadnouh.github.io/og.png"#' _site/index.html
          sed -i 's#<meta property="og:type"#<meta property="og:url" content="https://raghadnouh.github.io/"/>\n<meta property="og:type"#' _site/index.html
          pip install -q --break-system-packages pillow
          python3 -c "from PIL import Image; Image.open('_site/og.png').convert('RGB').save('_site/og.jpg', quality=85, optimize=True, progressive=True)"
          sed -i 's#raghadnouh.github.io/og.png#raghadnouh.github.io/og.jpg#g; s#content="og.png"#content="https://raghadnouh.github.io/og.jpg"#g' _site/index.html
          ls -lh _site/og.jpg
          grep -o 'og:[a-z]*" content="[^"]*' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
